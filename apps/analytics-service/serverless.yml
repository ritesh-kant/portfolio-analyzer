org: ritesh47
app: portfolio-analyzer
service: analytics-service
frameworkVersion: '4'

build:
  esbuild:
    bundle: true
    format: cjs
    platform: node
    target: node20
    external:
      - mongoose
      - mongodb

provider:
  name: aws
  runtime: nodejs20.x
  architecture: arm64
  stage: dev
  region: ap-south-1
  logRetentionInDays: 14
  environment:
    MONGODB_URI: ${env:MONGODB_URI, 'mongodb://admin:admin123@localhost:27017/portfolio_analyzer?authSource=admin'}
    MFAPI_SCHEME_CODE: '120716'
    AUTH_SECRET: ${env:AUTH_SECRET, 'local-dev-secret-change-in-prod'}
    ALLOWED_ORIGIN: ${env:ALLOWED_ORIGIN, 'http://localhost:3000'}
  httpApi:
    cors:
      allowedOrigins:
        - ${env:ALLOWED_ORIGIN, 'http://localhost:3000'}
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS

plugins:
  - serverless-dotenv-plugin
  - serverless-offline

custom:
  dotenv:
    path: ../../.env
  serverless-offline:
    httpPort: 4001
    lambdaPort: 4003
    noPrependStageInUrl: true

functions:
  benchmark:
    handler: src/handlers/benchmark.handler
    events:
      - httpApi:
          path: /analytics/benchmark
          method: get
  tax:
    handler: src/handlers/tax.handler
    events:
      - httpApi:
          path: /analytics/tax
          method: get
  score:
    handler: src/handlers/score.handler
    events:
      - httpApi:
          path: /analytics/score
          method: get
