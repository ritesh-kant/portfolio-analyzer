org: ritesh47
app: portfolio-analyzer
service: analytics-service
frameworkVersion: '4'

build:
  esbuild:
    bundle: true
    format: cjs
    platform: node
    target: node20
    external:
      - mongoose
      - mongodb

provider:
  name: aws
  runtime: nodejs20.x
  architecture: arm64
  stage: ${opt:stage, 'dev'}
  deploymentBucket:
    versioning: false
    maxPreviousDeploymentArtifacts: 1
  region: ap-south-1
  logRetentionInDays: 14
  timeout: 15
  # Required SSM parameters (must exist under /portfolio-analyzer/<stage>/):
  #   MONGODB_URI      — MongoDB Atlas connection string
  #   AUTH_SECRET      — NextAuth secret (base64, min 32 bytes)
  environment:
    MONGODB_URI: ${ssm:/portfolio-analyzer/${sls:stage}/MONGODB_URI, 'mongodb://admin:admin123@localhost:27017/portfolio_analyzer?authSource=admin'}
    MFAPI_SCHEME_CODE: '120716'
    AUTH_SECRET: ${ssm:/portfolio-analyzer/${sls:stage}/AUTH_SECRET, 'local-dev-secret-change-in-prod'}
    ALLOWED_ORIGIN: ${env:ALLOWED_ORIGIN, 'http://localhost:3000'}
  httpApi:
    cors:
      allowedOrigins:
        - ${env:ALLOWED_ORIGIN, 'http://localhost:3000'}
        - https://portfolio-analyzer-web-alpha.vercel.app
        - https://raptguru.in
        - https://www.raptguru.in
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS

plugins:
  - serverless-dotenv-plugin
  - serverless-offline

custom:
  dotenv:
    path: ../../.env
  serverless-offline:
    httpPort: 4001
    lambdaPort: 4003
    noPrependStageInUrl: true

functions:
  benchmark:
    handler: src/handlers/benchmark.handler
    events:
      - httpApi:
          path: /analytics/benchmark
          method: get
  tax:
    handler: src/handlers/tax.handler
    events:
      - httpApi:
          path: /analytics/tax
          method: get
  score:
    handler: src/handlers/score.handler
    events:
      - httpApi:
          path: /analytics/score
          method: get
