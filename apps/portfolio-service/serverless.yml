org: ritesh47
app: portfolio-analyzer
service: portfolio-service
frameworkVersion: '4'

build:
  esbuild:
    bundle: true
    format: cjs
    platform: node
    target: node20
    external:
      - mongoose
      - mongodb

provider:
  name: aws
  runtime: nodejs20.x
  architecture: arm64
  stage: ${opt:stage, 'dev'}
  deploymentBucket:
    versioning: false
    maxPreviousDeploymentArtifacts: 1
  region: ap-south-1
  logRetentionInDays: 14
  timeout: 15
  # Required SSM parameters (must exist under /portfolio-analyzer/<stage>/):
  #   MONGODB_URI      — MongoDB Atlas connection string
  #   AUTH_SECRET      — NextAuth secret (base64, min 32 bytes)
  environment:
    MONGODB_URI: ${ssm:/portfolio-analyzer/${sls:stage}/MONGODB_URI, 'mongodb://admin:admin123@localhost:27017/portfolio_analyzer?authSource=admin'}
    ZERODHA_API_KEY: ${env:ZERODHA_API_KEY, ''}
    ZERODHA_API_SECRET: ${env:ZERODHA_API_SECRET, ''}
    ZERODHA_ACCESS_TOKEN: ${env:ZERODHA_ACCESS_TOKEN, ''}
    MFAPI_SCHEME_CODE: '120716'
    AUTH_SECRET: ${ssm:/portfolio-analyzer/${sls:stage}/AUTH_SECRET, 'local-dev-secret-change-in-prod'}
    ALLOWED_ORIGIN: ${env:ALLOWED_ORIGIN, 'http://localhost:3000'}
    SIGNAL_ENGINE_INGESTER_FN: signal-engine-${self:provider.stage}-newsIngester
    NT_NEWS_DELAY_SECONDS: ${env:NT_NEWS_DELAY_SECONDS, '900'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action: lambda:InvokeFunction
          Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:signal-engine-${self:provider.stage}-newsIngester"
  httpApi:
    cors:
      allowedOrigins:
        - ${env:ALLOWED_ORIGIN, 'http://localhost:3000'}
        - https://portfolio-analyzer-web-alpha.vercel.app
        - https://raptguru.in
        - https://www.raptguru.in
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS

plugins:
  - serverless-dotenv-plugin
  - serverless-offline

custom:
  dotenv:
    path: ../../.env
  serverless-offline:
    httpPort: 3001
    lambdaPort: 3003
    noPrependStageInUrl: true

functions:
  holdings:
    handler: src/handlers/holdings.handler
    events:
      - httpApi:
          path: /portfolio/holdings
          method: get
  importGroww:
    handler: src/handlers/import.handler
    events:
      - httpApi:
          path: /portfolio/import
          method: post
  summary:
    handler: src/handlers/summary.handler
    events:
      - httpApi:
          path: /portfolio/summary
          method: get
  snapshots:
    handler: src/handlers/snapshots.handler
    events:
      - httpApi:
          path: /portfolio/snapshots
          method: get
  transactions:
    handler: src/handlers/transactions.handler
    events:
      - httpApi:
          path: /portfolio/transactions
          method: get
  importTransactions:
    handler: src/handlers/import-transactions.handler
    events:
      - httpApi:
          path: /portfolio/transactions/import
          method: post
  ntPositions:
    handler: src/handlers/nt-positions.handler
    events:
      - httpApi:
          path: /nt/positions
          method: get
  ntSignals:
    handler: src/handlers/nt-signals.handler
    events:
      - httpApi:
          path: /nt/signals
          method: get
  ntNews:
    handler: src/handlers/nt-news.handler
    events:
      - httpApi:
          path: /nt/news
          method: get
  ntStats:
    handler: src/handlers/nt-stats.handler
    timeout: 60
    events:
      - httpApi:
          path: /nt/stats
          method: get
  ntPipeline:
    handler: src/handlers/nt-pipeline.handler
    events:
      - httpApi:
          path: /nt/pipeline
          method: post
  ntPipelineStatus:
    handler: src/handlers/nt-pipeline-status.handler
    events:
      - httpApi:
          path: /nt/pipeline/status
          method: get
  ntPipelineHistory:
    handler: src/handlers/nt-pipeline-history.handler
    events:
      - httpApi:
          path: /nt/pipeline/history
          method: get
  ntPipelinePositions:
    handler: src/handlers/nt-pipeline-positions.handler
    events:
      - httpApi:
          path: /nt/pipeline/{id}/positions
          method: get
