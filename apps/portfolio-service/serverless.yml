service: portfolio-service
frameworkVersion: '4'

build:
  esbuild:
    bundle: true
    format: cjs
    platform: node
    target: node20
    external:
      - mongoose
      - mongodb

provider:
  name: aws
  runtime: nodejs20.x
  architecture: arm64
  stage: dev
  region: ap-south-1
  logRetentionInDays: 14
  environment:
    MONGODB_URI: ${env:MONGODB_URI, 'mongodb://admin:admin123@localhost:27017/portfolio_analyzer?authSource=admin'}
    ZERODHA_API_KEY: ${env:ZERODHA_API_KEY, ''}
    ZERODHA_API_SECRET: ${env:ZERODHA_API_SECRET, ''}
    ZERODHA_ACCESS_TOKEN: ${env:ZERODHA_ACCESS_TOKEN, ''}
    MFAPI_SCHEME_CODE: '120716'
    AUTH_SECRET: ${env:AUTH_SECRET}
    ALLOWED_ORIGIN: ${env:ALLOWED_ORIGIN, 'http://localhost:3000'}
  httpApi:
    cors:
      allowedOrigins:
        - ${env:ALLOWED_ORIGIN, 'http://localhost:3000'}
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS

plugins:
  - serverless-dotenv-plugin
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3001
    lambdaPort: 3003
    noPrependStageInUrl: true

functions:
  holdings:
    handler: src/handlers/holdings.handler
    events:
      - httpApi:
          path: /portfolio/holdings
          method: get
  importGroww:
    handler: src/handlers/import.handler
    events:
      - httpApi:
          path: /portfolio/import
          method: post
  summary:
    handler: src/handlers/summary.handler
    events:
      - httpApi:
          path: /portfolio/summary
          method: get
  snapshots:
    handler: src/handlers/snapshots.handler
    events:
      - httpApi:
          path: /portfolio/snapshots
          method: get
  transactions:
    handler: src/handlers/transactions.handler
    events:
      - httpApi:
          path: /portfolio/transactions
          method: get
  importTransactions:
    handler: src/handlers/import-transactions.handler
    events:
      - httpApi:
          path: /portfolio/transactions/import
          method: post
