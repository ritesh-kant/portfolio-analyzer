[project]
name = "signal-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-deepseek>=0.1.0",
    "langchain-google-genai>=2.0.0",
    "motor>=3.7.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.13.0",
    "requests>=2.32.0",
    "httpx>=0.28.0",
    "yfinance>=0.2.50",
    "pandas>=2.2.0",
    "pandas-ta>=0.3.14b0",
    "numpy>=2.2.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.0",
    "prettytable>=3.10.0",
    "pyarrow>=15.0.0",
    "scipy>=1.13.0",
    "lightgbm>=4.3.0",
    "mlflow>=2.14.0",
    "pdfplumber>=0.11.9",
    "upstox-python-sdk>=2.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "boto3>=1.35.0",  # needed to mock SQS calls in handler tests
]
aws = [
    "mangum>=0.19.0",
    "boto3>=1.35.0",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
strict = true
disallow_any_generics = false
python_version = "3.12"
mypy_path = "."

[[tool.mypy.overrides]]
module = ["boto3", "feedparser", "pandas", "yfinance", "upstox_client", "upstox_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # LGBMClassifier OOF folds are fit on numpy slices; sklearn warns about
    # feature-name presence mismatch between train/predict. Benign — the
    # final model is fit with a DataFrame and predict_proba uses one too.
    "ignore:X does not have valid feature names:UserWarning",
]
