org: ritesh47
app: portfolio-analyzer
service: signal-engine
frameworkVersion: '4'

# Heavy Python deps (pandas, yfinance, langgraph) exceed the 250 MB zip limit.
# Deploy as a Docker container image pushed to ECR.
build:
  esbuild: false # Python — no esbuild

provider:
  name: aws
  region: ${env:AWS_REGION, 'ap-south-1'}
  stage: ${opt:stage, 'dev'}
  architecture: arm64
  memorySize: 2048
  timeout: 900 # max Lambda timeout; pipeline can take ~10 min
  logRetentionInDays: 14

  ecr:
    images:
      signal-engine:
        uri: ${env:SIGNAL_ENGINE_IMAGE_URI}

  environment:
    MONGODB_URI: ${ssm:/portfolio-analyzer/${sls:stage}/MONGODB_URI}
    SIGNAL_ENGINE_API_KEY: ${ssm:/portfolio-analyzer/${sls:stage}/SIGNAL_ENGINE_API_KEY}
    AI_PROVIDER: ${env:AI_PROVIDER, 'anthropic'}
    ANTHROPIC_API_KEY: ${ssm:/portfolio-analyzer/${sls:stage}/ANTHROPIC_API_KEY, ''}
    OPENAI_API_KEY: ${ssm:/portfolio-analyzer/${sls:stage}/OPENAI_API_KEY, ''}
    GEMINI_API_KEY: ${ssm:/portfolio-analyzer/${sls:stage}/GEMINI_API_KEY, ''}
    TRADING_MODE: ${env:TRADING_MODE, 'paper'}
    ALERT_WEBHOOK_URL: ${env:ALERT_WEBHOOK_URL, ''}
    TELEGRAM_BOT_TOKEN: ${ssm:/portfolio-analyzer/${sls:stage}/TELEGRAM_BOT_TOKEN, ''}
    TELEGRAM_CHAT_ID: ${ssm:/portfolio-analyzer/${sls:stage}/TELEGRAM_CHAT_ID, ''}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - ssm:GetParameter
            - ssm:GetParameters
          Resource: arn:aws:ssm:${aws:region}:${aws:accountId}:parameter/portfolio-analyzer/${sls:stage}/*
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource:
            - !GetAtt NewsRawQueue.Arn
            - !GetAtt NewsSignalsQueue.Arn

plugins:
  - serverless-dotenv-plugin

custom:
  serverless-offline:
    httpPort: 8000

functions:
  api:
    image:
      name: signal-engine
    url:
      authorizer: aws_iam
    events:
      - httpApi:
          path: /health
          method: get
      - httpApi:
          path: /pipeline/run
          method: post
    description: Signal-engine FastAPI (Mangum ASGI adapter) — quant pipeline endpoint
    environment:
      AWS_SECRETS_ENABLED: 'true'

  # ── News-trader Lambdas ──────────────────────────────────────────────────────

  newsIngester:
    image:
      name: signal-engine
      command:
        - handlers.news_ingester.handler
    description: Poll RSS + NSE/BSE announcements every 5 min; dedup + enqueue
    memorySize: 512
    timeout: 120
    environment:
      NEWS_RAW_QUEUE_URL: !Ref NewsRawQueue
    events:
      # Market hours: 09:00–15:35 IST = 03:30–10:05 UTC, Mon–Fri
      - schedule:
          rate: cron(*/5 3-10 ? * MON-FRI *)
          enabled: true

  newsClassifier:
    image:
      name: signal-engine
      command:
        - handlers.news_classifier.handler
    description: Gemini 1.5 Flash classifier; enqueues high/medium signals with 15-min delay
    memorySize: 512
    timeout: 60
    environment:
      NEWS_SIGNALS_QUEUE_URL: !Ref NewsSignalsQueue
    events:
      - sqs:
          arn: !GetAtt NewsRawQueue.Arn
          batchSize: 5
          maximumBatchingWindow: 30
          functionResponseType: ReportBatchItemFailures

  tradeDecision:
    image:
      name: signal-engine
      command:
        - handlers.trade_decision.handler
    description: Check capacity, fetch price, open paper position, send Telegram alert
    memorySize: 512
    timeout: 60
    events:
      - sqs:
          arn: !GetAtt NewsSignalsQueue.Arn
          batchSize: 1
          functionResponseType: ReportBatchItemFailures

  slMonitor:
    image:
      name: signal-engine
      command:
        - handlers.sl_monitor.handler
    description: Update trailing SL every 3 min; close positions on SL/target/day-5
    memorySize: 512
    timeout: 60
    events:
      # Market hours: 09:15–15:30 IST = 03:45–10:00 UTC, Mon–Fri
      - schedule:
          rate: cron(*/3 3-10 ? * MON-FRI *)
          enabled: true

resources:
  Resources:
    # ── SQS Queues ────────────────────────────────────────────────────────────

    NewsRawQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: nt-news-raw-${sls:stage}
        MessageRetentionPeriod: 86400 # 1 day
        VisibilityTimeout: 120
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt NewsRawDLQ.Arn
          maxReceiveCount: 3

    NewsRawDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: nt-news-raw-dlq-${sls:stage}
        MessageRetentionPeriod: 604800 # 7 days

    NewsSignalsQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: nt-news-signals-${sls:stage}
        MessageRetentionPeriod: 86400
        # Max SQS delay is 15 min (900s) — matches nt_news_delay_seconds
        VisibilityTimeout: 120
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt NewsSignalsDLQ.Arn
          maxReceiveCount: 3

    NewsSignalsDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: nt-news-signals-dlq-${sls:stage}
        MessageRetentionPeriod: 604800

  Outputs:
    SignalEngineFunctionName:
      Value: !Ref ApiLambdaFunction
      Export:
        Name: ${sls:stage}-signal-engine-function-name
    SignalEngineFunctionArn:
      Value: !GetAtt ApiLambdaFunction.Arn
      Export:
        Name: ${sls:stage}-signal-engine-function-arn
    SignalEngineFunctionUrl:
      Value: !GetAtt ApiLambdaFunctionUrl.FunctionUrl
      Export:
        Name: ${sls:stage}-signal-engine-function-url
    NewsRawQueueUrl:
      Value: !Ref NewsRawQueue
      Export:
        Name: ${sls:stage}-nt-news-raw-queue-url
    NewsSignalsQueueUrl:
      Value: !Ref NewsSignalsQueue
      Export:
        Name: ${sls:stage}-nt-news-signals-queue-url
