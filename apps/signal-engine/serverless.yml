org: ritesh47
app: portfolio-analyzer
service: signal-engine
frameworkVersion: '4'

# Heavy Python deps (pandas, yfinance, langgraph) exceed the 250 MB zip limit.
# Deploy as a Docker container image pushed to ECR.
build:
  esbuild: false # Python — no esbuild

provider:
  name: aws
  region: ${env:AWS_REGION, 'ap-south-1'}
  stage: ${opt:stage, 'dev'}
  architecture: arm64
  memorySize: 2048
  timeout: 900 # max Lambda timeout; pipeline can take ~10 min
  logRetentionInDays: 14
  deploymentBucket:
    versioning: false
    maxPreviousDeploymentArtifacts: 1

  ecr:
    images:
      signal-engine:
        uri: ${env:SIGNAL_ENGINE_IMAGE_URI}

  # Required SSM parameters (must exist under /portfolio-analyzer/<stage>/):
  #   MONGODB_URI           — MongoDB Atlas connection string
  #   SIGNAL_ENGINE_API_KEY — internal API key for Lambda-to-Lambda calls
  #   GEMINI_API_KEY        — primary LLM (Gemini 1.5 Flash classifier)
  #   TELEGRAM_BOT_TOKEN    — Telegram bot token from @BotFather
  #   TELEGRAM_CHAT_ID      — Telegram chat ID to receive trade alerts
  # Optional SSM parameters (fallback to empty string if absent):
  #   ANTHROPIC_API_KEY     — Claude (unused while AI_PROVIDER=gemini)
  #   OPENAI_API_KEY        — OpenAI (unused while AI_PROVIDER=gemini)
  environment:
    MONGODB_URI: ${ssm:/portfolio-analyzer/${sls:stage}/MONGODB_URI}
    SIGNAL_ENGINE_API_KEY: ${ssm:/portfolio-analyzer/${sls:stage}/SIGNAL_ENGINE_API_KEY}
    AI_PROVIDER: ${env:AI_PROVIDER, 'gemini'}
    ANTHROPIC_API_KEY: ${ssm:/portfolio-analyzer/${sls:stage}/ANTHROPIC_API_KEY, ''}
    OPENAI_API_KEY: ${ssm:/portfolio-analyzer/${sls:stage}/OPENAI_API_KEY, ''}
    GEMINI_API_KEY: ${ssm:/portfolio-analyzer/${sls:stage}/GEMINI_API_KEY, ''}
    TRADING_MODE: ${env:TRADING_MODE, 'paper'}
    NT_CLASSIFIER_PROMPT_VERSION: ${env:NT_CLASSIFIER_PROMPT_VERSION, '1.0.0'}
    ALERT_WEBHOOK_URL: ${env:ALERT_WEBHOOK_URL, ''}
    TELEGRAM_BOT_TOKEN: ${ssm:/portfolio-analyzer/${sls:stage}/TELEGRAM_BOT_TOKEN, ''}
    TELEGRAM_CHAT_ID: ${ssm:/portfolio-analyzer/${sls:stage}/TELEGRAM_CHAT_ID, ''}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - ssm:GetParameter
            - ssm:GetParameters
          Resource: arn:aws:ssm:${aws:region}:${aws:accountId}:parameter/portfolio-analyzer/${sls:stage}/*
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource:
            - !GetAtt NewsRawQueue.Arn
            - !GetAtt NewsSignalsQueue.Arn

plugins:
  - serverless-dotenv-plugin

custom:
  serverless-offline:
    httpPort: 8000

functions:
  api:
    image:
      name: signal-engine
    url:
      authorizer: aws_iam
    events:
      - httpApi:
          path: /health
          method: get
      - httpApi:
          path: /pipeline/run
          method: post
    description: Signal-engine FastAPI (Mangum ASGI adapter) — quant pipeline endpoint
    environment:
      AWS_SECRETS_ENABLED: 'true'

  # ── News-trader Lambdas ──────────────────────────────────────────────────────

  newsIngester:
    image:
      name: signal-engine
      command:
        - handlers.news_ingester.handler
    description: Poll RSS + NSE/BSE announcements every 5 min; dedup + enqueue
    memorySize: 512
    timeout: 120
    environment:
      NEWS_RAW_QUEUE_URL: !Ref NewsRawQueue
    events:
      # Market hours: 09:00–14:15 IST = 03:30–08:45 UTC, Mon–Fri
      # Stops at 08:45 UTC (14:15 IST) so the last signal, after the 15-min SQS
      # delay, fires trade-decision by 14:30 IST — well before the 15:30 close.
      # The code-level entry_cutoff gate in trade_decision is a second safety net
      # for any SQS messages that linger in the queue past the cutoff.
      - schedule:
          rate: cron(*/5 3-8 ? * MON-FRI *)
          enabled: true

  newsClassifier:
    image:
      name: signal-engine
      command:
        - handlers.news_classifier.handler
    description: Gemini 1.5 Flash classifier; enqueues high/medium signals with 15-min delay
    memorySize: 512
    timeout: 90
    environment:
      NEWS_SIGNALS_QUEUE_URL: !Ref NewsSignalsQueue
    events:
      - sqs:
          arn: !GetAtt NewsRawQueue.Arn
          batchSize: 5
          maximumBatchingWindow: 30
          functionResponseType: ReportBatchItemFailures

  tradeDecision:
    image:
      name: signal-engine
      command:
        - handlers.trade_decision.handler
    description: Check capacity, fetch price, open paper position, send Telegram alert
    memorySize: 1024
    timeout: 60
    events:
      - sqs:
          arn: !GetAtt NewsSignalsQueue.Arn
          batchSize: 1
          functionResponseType: ReportBatchItemFailures

  slMonitor:
    image:
      name: signal-engine
      command:
        - handlers.sl_monitor.handler
    description: Update trailing SL every 3 min; close positions on SL/target/day-5
    memorySize: 512
    timeout: 60
    events:
      # Market hours: 09:15–15:30 IST = 03:45–10:00 UTC, Mon–Fri
      - schedule:
          rate: cron(*/3 3-10 ? * MON-FRI *)
          enabled: true

  # ── Options-trader Lambdas ───────────────────────────────────────────────────
  # Completely isolated from the equity (nt_*) Lambdas.

  optTradeDecision:
    image:
      name: signal-engine
      command:
        - handlers.opt_trade_decision.handler
    description: Open paper short-straddle positions from nt_signals (read-only); writes opt_paper_positions
    memorySize: 512
    timeout: 60
    events:
      # Paused 2026-06-15: single-stock monthly options not viable (spread > theta, no real NSE data from Lambda)
      - schedule:
          rate: cron(*/5 3-8 ? * MON-FRI *)
          enabled: false

  optPositionMonitor:
    image:
      name: signal-engine
      command:
        - handlers.opt_position_monitor.handler
    description: Reprice + exit open straddles; log opt_chain_snapshots every 3 min
    memorySize: 512
    timeout: 90
    events:
      # Paused 2026-06-15: single-stock monthly options not viable (spread > theta, no real NSE data from Lambda)
      - schedule:
          rate: cron(*/3 3-10 ? * MON-FRI *)
          enabled: false

resources:
  Resources:
    # ── SQS Queues ────────────────────────────────────────────────────────────

    NewsRawQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: nt-news-raw-${sls:stage}
        MessageRetentionPeriod: 86400 # 1 day
        VisibilityTimeout: 120
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt NewsRawDLQ.Arn
          maxReceiveCount: 3

    NewsRawDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: nt-news-raw-dlq-${sls:stage}
        MessageRetentionPeriod: 604800 # 7 days

    NewsSignalsQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: nt-news-signals-${sls:stage}
        MessageRetentionPeriod: 86400
        # Max SQS delay is 15 min (900s) — matches nt_news_delay_seconds
        VisibilityTimeout: 120
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt NewsSignalsDLQ.Arn
          maxReceiveCount: 3

    NewsSignalsDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: nt-news-signals-dlq-${sls:stage}
        MessageRetentionPeriod: 604800

  Outputs:
    SignalEngineFunctionName:
      Value: !Ref ApiLambdaFunction
      Export:
        Name: ${sls:stage}-signal-engine-function-name
    SignalEngineFunctionArn:
      Value: !GetAtt ApiLambdaFunction.Arn
      Export:
        Name: ${sls:stage}-signal-engine-function-arn
    SignalEngineFunctionUrl:
      Value: !GetAtt ApiLambdaFunctionUrl.FunctionUrl
      Export:
        Name: ${sls:stage}-signal-engine-function-url
    NewsRawQueueUrl:
      Value: !Ref NewsRawQueue
      Export:
        Name: ${sls:stage}-nt-news-raw-queue-url
    NewsSignalsQueueUrl:
      Value: !Ref NewsSignalsQueue
      Export:
        Name: ${sls:stage}-nt-news-signals-queue-url
