service: trading-service
frameworkVersion: '4'

build:
  esbuild:
    bundle: true
    format: cjs
    platform: node
    target: node20
    external:
      - mongoose
      - mongodb
      - '@portfolio-analyzer/db'
      - '@portfolio-analyzer/trading-types'

provider:
  name: aws
  runtime: nodejs20.x
  stage: dev
  region: ap-south-1
  environment:
    MONGODB_URI: ${env:MONGODB_URI, 'mongodb://admin:admin123@localhost:27017/portfolio_analyzer?authSource=admin'}
    SIGNAL_ENGINE_URL: ${env:SIGNAL_ENGINE_URL, 'http://localhost:8000'}
    SIGNAL_ENGINE_API_KEY: ${env:SIGNAL_ENGINE_API_KEY, 'local-dev-key-change-in-prod'}
    TRADING_MODE: ${env:TRADING_MODE, 'paper'}
    VIRTUAL_PORTFOLIO_INITIAL: ${env:VIRTUAL_PORTFOLIO_INITIAL, '100000'}
    MIN_SIGNAL_CONFIDENCE: ${env:MIN_SIGNAL_CONFIDENCE, '60'}
    MAX_POSITIONS: ${env:MAX_POSITIONS, '8'}
    POSITION_SIZE_PCT: ${env:POSITION_SIZE_PCT, '12'}
    QUEUE_PROVIDER: ${env:QUEUE_PROVIDER, 'local'}
    REDIS_URL: ${env:REDIS_URL, 'redis://localhost:6379'}
    AI_PROVIDER: ${env:AI_PROVIDER, 'anthropic'}
    ALERT_WEBHOOK_URL: ${env:ALERT_WEBHOOK_URL, ''}
  httpApi:
    cors:
      allowedOrigins:
        - '*'
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - OPTIONS

plugins:
  - serverless-dotenv-plugin
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 6002
    lambdaPort: 6004
    noPrependStageInUrl: true

functions:
  health:
    handler: src/handlers/health.handler
    events:
      - httpApi:
          path: /trading/health
          method: get

  dashboard:
    handler: src/handlers/dashboard.handler
    events:
      - httpApi:
          path: /trading/dashboard
          method: get

  signals:
    handler: src/handlers/signals.handler
    events:
      - httpApi:
          path: /trading/signals
          method: get

  signalById:
    handler: src/handlers/signalById.handler
    events:
      - httpApi:
          path: /trading/signals/{id}
          method: get

  orders:
    handler: src/handlers/orders.handler
    events:
      - httpApi:
          path: /trading/orders
          method: get

  portfolio:
    handler: src/handlers/portfolio.handler
    events:
      - httpApi:
          path: /trading/portfolio
          method: get

  portfolioHistory:
    handler: src/handlers/portfolioHistory.handler
    events:
      - httpApi:
          path: /trading/portfolio/history
          method: get

  runs:
    handler: src/handlers/runs.handler
    events:
      - httpApi:
          path: /trading/runs
          method: get

  runById:
    handler: src/handlers/runById.handler
    events:
      - httpApi:
          path: /trading/runs/{id}
          method: get

  triggerRun:
    handler: src/handlers/triggerRun.handler
    timeout: 30
    events:
      - httpApi:
          path: /trading/runs/trigger
          method: post

  news:
    handler: src/handlers/news.handler
    events:
      - httpApi:
          path: /trading/news
          method: get

  # Daily scheduler — fires at 9:15 AM IST (3:45 AM UTC) Mon-Fri
  scheduler:
    handler: src/handlers/scheduler.handler
    timeout: 30
    events:
      - schedule:
          rate: cron(45 3 ? * MON-FRI *)
          enabled: true
          name: daily-trading-pipeline-${sls:stage}
          description: Triggers the daily trading signal pipeline before NSE market open

  # HTTP endpoint to manually invoke the scheduler (for testing)
  schedulerHttp:
    handler: src/handlers/scheduler.httpHandler
    timeout: 30
    events:
      - httpApi:
          path: /trading/runs/schedule
          method: post
