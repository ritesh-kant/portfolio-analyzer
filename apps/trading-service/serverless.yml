service: trading-service
frameworkVersion: '4'

build:
  esbuild:
    bundle: true
    format: cjs
    platform: node
    target: node20
    external:
      - mongoose
      - mongodb
      - '@portfolio-analyzer/db'
      - '@portfolio-analyzer/trading-types'
      - '@portfolio-analyzer/auth-utils'

provider:
  name: aws
  runtime: nodejs20.x
  architecture: arm64
  stage: dev
  region: ap-south-1
  logRetentionInDays: 14
  environment:
    MONGODB_URI: ${env:MONGODB_URI, 'mongodb://admin:admin123@localhost:27017/portfolio_analyzer?authSource=admin'}
    SIGNAL_ENGINE_URL: ${env:SIGNAL_ENGINE_URL, 'http://localhost:8000'}
    SIGNAL_ENGINE_API_KEY: ${env:SIGNAL_ENGINE_API_KEY, 'local-dev-key-change-in-prod'}
    TRADING_MODE: ${env:TRADING_MODE, 'paper'}
    VIRTUAL_PORTFOLIO_INITIAL: ${env:VIRTUAL_PORTFOLIO_INITIAL, '100000'}
    MIN_SIGNAL_CONFIDENCE: ${env:MIN_SIGNAL_CONFIDENCE, '60'}
    MAX_POSITIONS: ${env:MAX_POSITIONS, '8'}
    POSITION_SIZE_PCT: ${env:POSITION_SIZE_PCT, '12'}
    QUEUE_PROVIDER: ${env:QUEUE_PROVIDER, 'local'}
    # Self-reference: resolved by CloudFormation at deploy time so CI doesn't
    # need to pass this as an env var. Falls back to empty string for local dev.
    SQS_QUEUE_URL: !If
      - SqsEnabled
      - !Ref PipelineRunQueue
      - ''
    AI_PROVIDER: ${env:AI_PROVIDER, 'anthropic'}
    SIGNAL_ENGINE_FUNCTION_NAME: ${cf:signal-engine-${sls:stage}.SignalEngineFunctionName, ''}
    ALERT_WEBHOOK_URL: ${env:ALERT_WEBHOOK_URL, ''}
    AWS_REGION_NAME: ${env:AWS_REGION, 'ap-south-1'}
    AUTH_SECRET: ${env:AUTH_SECRET, 'local-dev-secret-change-in-prod'}
    ALLOWED_ORIGIN: ${env:ALLOWED_ORIGIN, 'http://localhost:3000'}
  httpApi:
    cors:
      allowedOrigins:
        - ${env:ALLOWED_ORIGIN, 'http://localhost:3000'}
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - OPTIONS

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource:
            - !GetAtt PipelineRunQueue.Arn
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - ${cf:signal-engine-${sls:stage}.SignalEngineFunctionArn, '*'}

plugins:
  - serverless-dotenv-plugin
  - serverless-offline

custom:
  dotenv:
    path: ../../.env
  serverless-offline:
    httpPort: 6002
    lambdaPort: 6004
    noPrependStageInUrl: true
  sqsEnabled:
    sqs: true
    local: false

functions:
  health:
    handler: src/handlers/health.handler
    events:
      - httpApi:
          path: /trading/health
          method: get

  dashboard:
    handler: src/handlers/dashboard.handler
    events:
      - httpApi:
          path: /trading/dashboard
          method: get

  signals:
    handler: src/handlers/signals.handler
    events:
      - httpApi:
          path: /trading/signals
          method: get

  signalById:
    handler: src/handlers/signalById.handler
    events:
      - httpApi:
          path: /trading/signals/{id}
          method: get

  orders:
    handler: src/handlers/orders.handler
    events:
      - httpApi:
          path: /trading/orders
          method: get

  portfolio:
    handler: src/handlers/portfolio.handler
    events:
      - httpApi:
          path: /trading/portfolio
          method: get

  portfolioHistory:
    handler: src/handlers/portfolioHistory.handler
    events:
      - httpApi:
          path: /trading/portfolio/history
          method: get

  runs:
    handler: src/handlers/runs.handler
    events:
      - httpApi:
          path: /trading/runs
          method: get

  runById:
    handler: src/handlers/runById.handler
    events:
      - httpApi:
          path: /trading/runs/{id}
          method: get

  triggerRun:
    handler: src/handlers/triggerRun.handler
    timeout: 30
    events:
      - httpApi:
          path: /trading/runs/trigger
          method: post

  news:
    handler: src/handlers/news.handler
    events:
      - httpApi:
          path: /trading/news
          method: get

  accuracy:
    handler: src/handlers/accuracy.handler
    events:
      - httpApi:
          path: /trading/accuracy
          method: get

  # Daily scheduler — fires at 9:15 AM IST (3:45 AM UTC) Mon-Fri
  scheduler:
    handler: src/handlers/scheduler.handler
    timeout: 30
    events:
      - schedule:
          rate: cron(45 3 ? * MON-FRI *)
          enabled: true
          name: daily-trading-pipeline-${sls:stage}
          description: Triggers the daily trading signal pipeline before NSE market open

  # HTTP endpoint to manually invoke the scheduler (for testing)
  schedulerHttp:
    handler: src/handlers/scheduler.httpHandler
    timeout: 30
    events:
      - httpApi:
          path: /trading/runs/schedule
          method: post

  # Position monitor — fires every 5 min during NSE market hours (09:15–15:30 IST)
  # cron(0/5 3-10 ? * MON-FRI *) fires at :00,:05,...,:55 from 08:30–16:59 IST,
  # safely bracketing the full NSE session. Lambda timeout=30s; no overlap risk at 5-min gaps.
  monitor:
    handler: src/handlers/monitor.handler
    timeout: 30
    events:
      - schedule:
          rate: cron(0/5 3-10 ? * MON-FRI *)
          enabled: true
          name: position-monitor-${sls:stage}
          description: Scans open positions for stop-loss and target triggers every 5 min during NSE hours

  # Manual HTTP trigger for the monitor (for testing)
  monitorHttp:
    handler: src/handlers/monitor.httpHandler
    timeout: 30
    events:
      - httpApi:
          path: /trading/monitor
          method: post

  # SQS consumer — only active when QUEUE_PROVIDER=sqs
  # Receives pipeline-run messages and forwards to signal-engine container.
  pipelineConsumer:
    handler: src/handlers/pipelineConsumer.handler
    timeout: 30
    reservedConcurrency: 1  # one pipeline at a time
    events:
      - sqs:
          arn: !GetAtt PipelineRunQueue.Arn
          batchSize: 1
          enabled: ${self:custom.sqsEnabled.${env:QUEUE_PROVIDER, 'local'}, false}

resources:
  Conditions:
    SqsEnabled: !Not [!Equals ["${env:QUEUE_PROVIDER, 'local'}", 'local']]

  Resources:
    PipelineRunQueue:
      Type: AWS::SQS::Queue
      Properties:
        # FIFO ensures at-most-once delivery and dedup via run_id
        QueueName: pipeline-runs-${sls:stage}.fifo
        FifoQueue: true
        ContentBasedDeduplication: false
        MessageRetentionPeriod: 86400  # 24 h
        VisibilityTimeout: 60          # > pipelineConsumer timeout (30s)
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt PipelineRunDLQ.Arn
          maxReceiveCount: 3

    PipelineRunDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: pipeline-runs-dlq-${sls:stage}.fifo
        FifoQueue: true
        MessageRetentionPeriod: 604800  # 7 days

  Outputs:
    PipelineRunQueueUrl:
      Value: !Ref PipelineRunQueue
      Export:
        Name: ${sls:stage}-PipelineRunQueueUrl
    PipelineRunQueueArn:
      Value: !GetAtt PipelineRunQueue.Arn
      Export:
        Name: ${sls:stage}-PipelineRunQueueArn
