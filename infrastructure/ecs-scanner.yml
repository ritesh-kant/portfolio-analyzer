AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Momentum-trader paper scanners. NSE: one Fargate task per session, started by
  EventBridge at 09:05 IST (03:35 UTC) Mon-Fri, exits itself at 15:35 IST.
  US: a second task definition on the same cluster and image, started by
  EventBridge Scheduler at 09:20 America/New_York (DST-aware), exits at 16:20 ET.
  Both read secrets from SSM /portfolio-analyzer/<stage>/*.
  Deploy:
    aws cloudformation deploy --stack-name mt-scanner-prod \
      --template-file infrastructure/ecs-scanner.yml --capabilities CAPABILITY_NAMED_IAM \
      --parameter-overrides Stage=prod ImageUri=<ecr>/portfolio-analyzer/mt-scanner:latest \
        SubnetIds=subnet-a,subnet-b SecurityGroupId=sg-xxx

Parameters:
  Stage:
    Type: String
    Default: prod
  ImageUri:
    Type: String
    Description: ECR image built from apps/signal-engine/Dockerfile.scanner
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets (task needs egress to Upstox + Atlas) or private with NAT
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  Cpu:
    Type: String
    Default: '512'
  Memory:
    Type: String
    Default: '1024'

Resources:
  # Imported into this stack (created out-of-band 2026-09-07). Name is literal,
  # not !Sub'd on Stage, because that is the name the deploy workflow pushes to.
  ScannerRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: portfolio-analyzer-mt-scanner
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only the most recent image",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 1
                },
                "action": { "type": "expire" }
              }
            ]
          }

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub portfolio-analyzer-mt-${Stage}

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/portfolio-analyzer/mt-scanner-${Stage}
      RetentionInDays: 30

  DataVolumeFs:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      FileSystemTags:
        - Key: Name
          Value: !Sub mt-scanner-data-${Stage}

  DataMountTargetA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref DataVolumeFs
      SubnetId: !Select [0, !Ref SubnetIds]
      SecurityGroups: [!Ref SecurityGroupId]

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub mt-scanner-exec-${Stage}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ssm-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ssm:GetParameters, ssm:GetParameter]
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portfolio-analyzer/${Stage}/*

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub mt-scanner-task-${Stage}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters]
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portfolio-analyzer/${Stage}/*
              - Effect: Allow
                Action: [elasticfilesystem:ClientMount, elasticfilesystem:ClientWrite]
                Resource: !GetAtt DataVolumeFs.Arn

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub mt-scanner-${Stage}
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: data
          EFSVolumeConfiguration:
            FilesystemId: !Ref DataVolumeFs
            TransitEncryption: ENABLED
      ContainerDefinitions:
        - Name: scanner
          Image: !Ref ImageUri
          Essential: true
          MountPoints:
            - SourceVolume: data
              ContainerPath: /data
          Environment:
            - { Name: STAGE, Value: !Ref Stage }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: AWS_SECRETS_ENABLED, Value: 'true' }
            - { Name: MOMENTUM_SCANNER_ONLY, Value: 'true' }
            - { Name: TRADING_MODE, Value: paper }
            # One forward strategy: the Warrior checklist plus frozen
            # structural support/resistance management. A one-minute close
            # below usable support exits after resting stop/target checks; a
            # fixed target is capped at entry-known structural resistance.
            # research/hypotheses/2026-09-22-structural-support-resistance-exit.md
            - { Name: MT_STRATEGY, Value: warrior_strict }
            - { Name: MT_ATTENTION_DAY_CHG_MIN, Value: '1.5' }
            - { Name: MT_ATTENTION_RVOL_MIN, Value: '1.5' }
            # "DO trade during peak volatility hours." The guide's 07:00-10:00
            # EST is mostly US pre-market, which NSE does not have; this is the
            # first 105 minutes of the NSE session. Chosen from volume shape,
            # never from returns — see the hypothesis.
            - { Name: MT_PEAK_HOURS_END, Value: '11:00' }
            # "MACD open": how far the 1-min histogram may shrink vs the prior
            # bar and still pass. 0 = the frozen 09-15 rule (any shrink refuses).
            # Tried 5-10% on 2026-09-23; every level only added losers (BT48).
            - { Name: MT_MACD_OPEN_TOLERANCE, Value: '0' }
            # 3 strikes / 50% give-back / starter size / size down on a loss.
            - { Name: MT_DISCIPLINE, Value: 'true' }
            # 50% give-back halt OFF (operator decision 2026-09-23); 3 strikes
            # and the size ladder stay on. 'true' to restore.
            - { Name: MT_GIVEBACK_HALT, Value: 'false' }
            # Multi-entry + 20 slots (operator decision 2026-09-13). Re-entry is
            # sequential per symbol; the slot count is what lets the extra
            # trades actually be held. Counter-evidence is recorded on
            # Settings.mt_one_trade_per_day — revert both to 'true'/5 to undo.
            - { Name: MT_ONE_TRADE_PER_DAY, Value: 'false' }
            - { Name: MT_MAX_POSITIONS, Value: '20' }
            - { Name: MT_LOG_CSV, Value: /data/mt_warrior_strict_forward_log.csv }
          Secrets:
            - Name: MONGODB_URI
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portfolio-analyzer/${Stage}/MONGODB_URI
            - Name: TELEGRAM_BOT_TOKEN
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portfolio-analyzer/${Stage}/TELEGRAM_BOT_TOKEN
            - Name: TELEGRAM_CHAT_ID
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portfolio-analyzer/${Stage}/TELEGRAM_CHAT_ID
            - Name: UPSTOX_ANALYTICS_TOKEN
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portfolio-analyzer/${Stage}/UPSTOX_ANALYTICS_TOKEN
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: scanner

  EventsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub mt-scanner-events-${Stage}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: run-task
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: [!Ref TaskDefinition]
              - Effect: Allow
                Action: iam:PassRole
                Resource: [!GetAtt ExecutionRole.Arn, !GetAtt TaskRole.Arn]

  MorningStart:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub mt-scanner-start-${Stage}
      Description: Start the scanner at 09:05 IST Mon-Fri (03:35 UTC). NSE holidays exit early in-process.
      ScheduleExpression: cron(35 3 ? * MON-FRI *)
      State: ENABLED
      Targets:
        - Id: scanner
          Arn: !GetAtt Cluster.Arn
          RoleArn: !GetAtt EventsRole.Arn
          EcsParameters:
            TaskDefinitionArn: !Ref TaskDefinition
            LaunchType: FARGATE
            TaskCount: 1
            PlatformVersion: LATEST
            NetworkConfiguration:
              AwsVpcConfiguration:
                AssignPublicIp: ENABLED
                Subnets: !Ref SubnetIds
                SecurityGroups: [!Ref SecurityGroupId]

  # ── US momentum arm ──────────────────────────────────────────────────────────
  # Purely ADDITIVE: new task definition, new role, new schedule. It reuses the
  # cluster, image, EFS volume, log group and the two task roles above WITHOUT
  # modifying any of them, so an error here can only roll back these resources'
  # creation — never change how the NSE task runs.
  #
  # Same image, different entrypoint: src/momentum_trader/us_session.py. Market
  # data is Yahoo + the Nasdaq halt RSS, so no broker token is needed. Nothing is
  # ever sent to a broker: this is a paper arm.
  UsTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub mt-us-scanner-${Stage}
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: data
          EFSVolumeConfiguration:
            FilesystemId: !Ref DataVolumeFs
            TransitEncryption: ENABLED
      ContainerDefinitions:
        - Name: us-scanner
          Image: !Ref ImageUri
          Essential: true
          Command: [python, -m, src.momentum_trader.us_session]
          MountPoints:
            - SourceVolume: data
              ContainerPath: /data
          Environment:
            - { Name: STAGE, Value: !Ref Stage }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: AWS_SECRETS_ENABLED, Value: 'true' }
            # Same exemption as the NSE task: no HTTP API and no LLM calls, so
            # Settings must not demand those keys (it still checks MONGODB_URI).
            # Without it Settings() refuses to start in prod — first Fargate
            # run on 2026-09-24 exited 1 on exactly that.
            - { Name: MOMENTUM_SCANNER_ONLY, Value: 'true' }
            - { Name: TRADING_MODE, Value: paper }
            # The US engine config is DERIVED from this strategy (us_session.
            # build_engine_config), so the two arms run one checklist. These
            # mirror the NSE task above on purpose; change both or neither.
            - { Name: MT_STRATEGY, Value: warrior_strict }
            - { Name: MT_ATTENTION_RVOL_MIN, Value: '1.5' }
            - { Name: MT_MACD_OPEN_TOLERANCE, Value: '0' }
            - { Name: MT_DISCIPLINE, Value: 'true' }
            - { Name: MT_GIVEBACK_HALT, Value: 'false' }
            - { Name: MT_ONE_TRADE_PER_DAY, Value: 'false' }
            # US-only values, in DOLLARS. See Settings.mt_us_* for why each is set.
            - { Name: MT_US_RISK_USD, Value: '50' }
            - { Name: MT_US_MAX_NOTIONAL_USD, Value: '5000' }
            - { Name: MT_US_MAX_POSITIONS, Value: '10' }
            - { Name: MT_US_PEAK_HOURS_ONLY, Value: 'false' }   # entries to the 15:10 ET cutoff
            - { Name: MT_US_PEAK_HOURS_END, Value: '10:00' }
            - { Name: MT_US_BLOCK_DELAYED_QUOTES, Value: 'true' }
            - { Name: MT_US_QUOTE_POLL_SECONDS, Value: '10' }   # REST fallback only
            # Yahoo push stream: fills on every trade instead of a 10 s poll.
            # STREAM_BARS=true would also decide ~5 s after the bar instead of
            # 22 s, on stream bars that miss wicks — see Settings.mt_us_stream_bars.
            - { Name: MT_US_STREAM, Value: 'true' }
            - { Name: MT_US_STREAM_BARS, Value: 'false' }
            - { Name: MT_US_STREAM_SETTLE_SECONDS, Value: '3' }
            - { Name: MT_US_CACHE_DIR, Value: /data/.cache_yahoo_us }
          Secrets:
            - Name: MONGODB_URI
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portfolio-analyzer/${Stage}/MONGODB_URI
            - Name: TELEGRAM_BOT_TOKEN
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portfolio-analyzer/${Stage}/TELEGRAM_BOT_TOKEN
            - Name: TELEGRAM_CHAT_ID
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portfolio-analyzer/${Stage}/TELEGRAM_CHAT_ID
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: us-scanner

  UsSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub mt-us-scanner-scheduler-${Stage}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: run-us-task
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Any revision of the US family, so a redeploy cannot race the
              # schedule against a policy still naming the old revision.
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/mt-us-scanner-${Stage}:*
              - Effect: Allow
                Action: iam:PassRole
                Resource: [!GetAtt ExecutionRole.Arn, !GetAtt TaskRole.Arn]

  # EventBridge SCHEDULER, not an EventBridge rule like the NSE start above.
  # Rules only accept UTC, and IST never shifts, so a UTC cron is fine for NSE.
  # The US switches clocks twice a year: 09:20 ET is 13:20 UTC in summer and
  # 14:20 UTC in winter, so a UTC cron would start the session an hour wrong
  # for half the year. The Scheduler takes the zone and follows DST itself.
  UsMorningStart:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub mt-us-scanner-start-${Stage}
      Description: >
        Start the US paper scanner at 09:20 America/New_York Mon-Fri. US
        holidays and early closes are handled in-process (us_calendar.py).
      ScheduleExpression: cron(20 9 ? * MON-FRI *)
      ScheduleExpressionTimezone: America/New_York
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn: !GetAtt Cluster.Arn
        RoleArn: !GetAtt UsSchedulerRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 2
          MaximumEventAgeInSeconds: 900
        EcsParameters:
          TaskDefinitionArn: !Ref UsTaskDefinition
          LaunchType: FARGATE
          TaskCount: 1
          PlatformVersion: LATEST
          NetworkConfiguration:
            AwsvpcConfiguration:
              AssignPublicIp: ENABLED
              Subnets: !Ref SubnetIds
              SecurityGroups: [!Ref SecurityGroupId]

Outputs:
  ClusterName:
    Value: !Ref Cluster
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
  UsTaskDefinitionArn:
    Value: !Ref UsTaskDefinition
  UsRunNow:
    Description: Manual start of the US session (add the task networking configuration)
    Value: !Sub >
      aws ecs run-task --cluster ${Cluster} --launch-type FARGATE --task-definition ${UsTaskDefinition}
  RunNow:
    Description: Manual start command (add the task networking configuration from this stack)
    Value: !Sub >
      aws ecs run-task --cluster ${Cluster} --launch-type FARGATE --task-definition ${TaskDefinition}
