AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Momentum-trader paper scanner: one Fargate task per NSE session, started by
  EventBridge at 09:05 IST (03:35 UTC) Mon-Fri; the process exits itself at
  15:35 IST. Reads secrets from SSM /portfolio-analyzer/<stage>/*.
  Deploy:
    aws cloudformation deploy --stack-name mt-scanner-prod \
      --template-file infrastructure/ecs-scanner.yml --capabilities CAPABILITY_NAMED_IAM \
      --parameter-overrides Stage=prod ImageUri=<ecr>/portfolio-analyzer/mt-scanner:latest \
        SubnetIds=subnet-a,subnet-b SecurityGroupId=sg-xxx

Parameters:
  Stage:
    Type: String
    Default: prod
  ImageUri:
    Type: String
    Description: ECR image built from apps/signal-engine/Dockerfile.scanner
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets (task needs egress to Upstox + Atlas) or private with NAT
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  Cpu:
    Type: String
    Default: '512'
  Memory:
    Type: String
    Default: '1024'

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub portfolio-analyzer-mt-${Stage}

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/portfolio-analyzer/mt-scanner-${Stage}
      RetentionInDays: 30

  DataVolumeFs:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      FileSystemTags:
        - Key: Name
          Value: !Sub mt-scanner-data-${Stage}

  DataMountTargetA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref DataVolumeFs
      SubnetId: !Select [0, !Ref SubnetIds]
      SecurityGroups: [!Ref SecurityGroupId]

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub mt-scanner-exec-${Stage}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ssm-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ssm:GetParameters, ssm:GetParameter]
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portfolio-analyzer/${Stage}/*

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub mt-scanner-task-${Stage}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters]
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portfolio-analyzer/${Stage}/*
              - Effect: Allow
                Action: [elasticfilesystem:ClientMount, elasticfilesystem:ClientWrite]
                Resource: !GetAtt DataVolumeFs.Arn

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub mt-scanner-${Stage}
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: data
          EFSVolumeConfiguration:
            FilesystemId: !Ref DataVolumeFs
            TransitEncryption: ENABLED
      ContainerDefinitions:
        - Name: scanner
          Image: !Ref ImageUri
          Essential: true
          MountPoints:
            - SourceVolume: data
              ContainerPath: /data
          Environment:
            - { Name: STAGE, Value: !Ref Stage }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: AWS_SECRETS_ENABLED, Value: 'true' }
            - { Name: MOMENTUM_SCANNER_ONLY, Value: 'true' }
            - { Name: TRADING_MODE, Value: paper }
            # The original attention_1m arm remains available as the frozen
            # control. Production paper scans use the separately logged
            # resistance-state treatment.
            - { Name: MT_STRATEGY, Value: attention_1m_resistance_state }
            - { Name: MT_ATTENTION_DAY_CHG_MIN, Value: '1.5' }
            - { Name: MT_ATTENTION_RVOL_MIN, Value: '1.5' }
            - { Name: MT_LOG_CSV, Value: /data/mt_attention_1m_resistance_state_forward_log.csv }
          Secrets:
            - Name: MONGODB_URI
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portfolio-analyzer/${Stage}/MONGODB_URI
            - Name: TELEGRAM_BOT_TOKEN
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portfolio-analyzer/${Stage}/TELEGRAM_BOT_TOKEN
            - Name: TELEGRAM_CHAT_ID
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portfolio-analyzer/${Stage}/TELEGRAM_CHAT_ID
            - Name: UPSTOX_ANALYTICS_TOKEN
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portfolio-analyzer/${Stage}/UPSTOX_ANALYTICS_TOKEN
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: scanner

  # A second task keeps the reclaim hypothesis independent from the existing
  # resistance-state paper arm. Both use the same read-only market feed and
  # EFS volume, but write strategy-labelled records and distinct CSV logs.
  ReclaimTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub mt-scanner-reclaim-${Stage}
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: data
          EFSVolumeConfiguration:
            FilesystemId: !Ref DataVolumeFs
            TransitEncryption: ENABLED
      ContainerDefinitions:
        - Name: scanner
          Image: !Ref ImageUri
          Essential: true
          MountPoints:
            - SourceVolume: data
              ContainerPath: /data
          Environment:
            - { Name: STAGE, Value: !Ref Stage }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: AWS_SECRETS_ENABLED, Value: 'true' }
            - { Name: MOMENTUM_SCANNER_ONLY, Value: 'true' }
            - { Name: TRADING_MODE, Value: paper }
            - { Name: MT_STRATEGY, Value: attention_1m_false_break_reclaim }
            - { Name: MT_ATTENTION_DAY_CHG_MIN, Value: '1.5' }
            - { Name: MT_ATTENTION_RVOL_MIN, Value: '1.5' }
            - { Name: MT_LOG_CSV, Value: /data/mt_attention_1m_false_break_reclaim_forward_log.csv }
          Secrets:
            - Name: MONGODB_URI
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portfolio-analyzer/${Stage}/MONGODB_URI
            - Name: TELEGRAM_BOT_TOKEN
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portfolio-analyzer/${Stage}/TELEGRAM_BOT_TOKEN
            - Name: TELEGRAM_CHAT_ID
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portfolio-analyzer/${Stage}/TELEGRAM_CHAT_ID
            - Name: UPSTOX_ANALYTICS_TOKEN
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portfolio-analyzer/${Stage}/UPSTOX_ANALYTICS_TOKEN
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: reclaim

  EventsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub mt-scanner-events-${Stage}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: run-task
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: [!Ref TaskDefinition, !Ref ReclaimTaskDefinition]
              - Effect: Allow
                Action: iam:PassRole
                Resource: [!GetAtt ExecutionRole.Arn, !GetAtt TaskRole.Arn]

  MorningStart:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub mt-scanner-start-${Stage}
      Description: Start the scanner at 09:05 IST Mon-Fri (03:35 UTC). NSE holidays exit early in-process.
      ScheduleExpression: cron(35 3 ? * MON-FRI *)
      State: ENABLED
      Targets:
        - Id: scanner
          Arn: !GetAtt Cluster.Arn
          RoleArn: !GetAtt EventsRole.Arn
          EcsParameters:
            TaskDefinitionArn: !Ref TaskDefinition
            LaunchType: FARGATE
            TaskCount: 1
            PlatformVersion: LATEST
            NetworkConfiguration:
              AwsVpcConfiguration:
                AssignPublicIp: ENABLED
                Subnets: !Ref SubnetIds
                SecurityGroups: [!Ref SecurityGroupId]
        - Id: reclaim-scanner
          Arn: !GetAtt Cluster.Arn
          RoleArn: !GetAtt EventsRole.Arn
          EcsParameters:
            TaskDefinitionArn: !Ref ReclaimTaskDefinition
            LaunchType: FARGATE
            TaskCount: 1
            PlatformVersion: LATEST
            NetworkConfiguration:
              AwsVpcConfiguration:
                AssignPublicIp: ENABLED
                Subnets: !Ref SubnetIds
                SecurityGroups: [!Ref SecurityGroupId]

Outputs:
  ClusterName:
    Value: !Ref Cluster
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
  ReclaimTaskDefinitionArn:
    Value: !Ref ReclaimTaskDefinition
  RunNow:
    Description: Manual start command (add the task networking configuration from this stack)
    Value: !Sub >
      aws ecs run-task --cluster ${Cluster} --launch-type FARGATE --task-definition ${TaskDefinition}
