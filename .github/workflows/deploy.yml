name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force deploy all services, ignoring change detection"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  NODE_VERSION: "20"
  PNPM_VERSION: "9.12.3"

jobs:
  # ──────────────────────────────────────────────
  # 0. Detect which parts of the codebase changed.
  #    Every deploy job reads these outputs to decide
  #    whether to run or skip itself.
  #
  #    packages/** is included in every filter because
  #    shared-types changes affect all consumers.
  # ──────────────────────────────────────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      portfolio-service: ${{ steps.filter.outputs.portfolio-service }}
      signals-service:   ${{ steps.filter.outputs.signals-service }}
      signal-engine:     ${{ steps.filter.outputs.signal-engine }}
      web:               ${{ steps.filter.outputs.web }}
      any-backend:       ${{ steps.filter.outputs.any-backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            portfolio-service:
              - 'apps/portfolio-service/**'
              - 'packages/**'
            signals-service:
              - 'apps/signals-service/**'
              - 'packages/**'
            signal-engine:
              - 'apps/signal-engine/**'
              - 'packages/**'
            web:
              - 'apps/web/**'
              - 'packages/**'
            any-backend:
              - 'apps/portfolio-service/**'
              - 'apps/signals-service/**'
              - 'apps/signal-engine/**'
              - 'packages/**'

  # ──────────────────────────────────────────────
  # 1. Build & type-check the entire monorepo.
  #    Skipped automatically when nothing relevant changed.
  # ──────────────────────────────────────────────
  build:
    name: Build monorepo
    needs: changes
    if: >
      inputs.force_deploy == true ||
      needs.changes.outputs.any-backend == 'true' ||
      needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build --filter='./packages/*'

      - name: Cache build output
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            apps/*/node_modules
          key: build-${{ github.sha }}

  # ──────────────────────────────────────────────
  # 2. Deploy portfolio-service — only when its
  #    files (or shared packages) changed.
  # ──────────────────────────────────────────────
  deploy-portfolio-service:
    name: Deploy portfolio-service (AWS)
    needs: [changes, build]
    # always() lets us evaluate the condition even when build was skipped.
    # We still gate on build succeeding so a typecheck failure blocks deploy.
    if: >
      always() &&
      needs.build.result == 'success' &&
      (inputs.force_deploy == true || needs.changes.outputs.portfolio-service == 'true')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            apps/*/node_modules
          key: build-${{ github.sha }}

      - name: Install dependencies (if cache miss)
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy portfolio-service
        working-directory: apps/portfolio-service
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          ZERODHA_API_KEY: ${{ secrets.ZERODHA_API_KEY }}
          ZERODHA_API_SECRET: ${{ secrets.ZERODHA_API_SECRET }}
          ZERODHA_ACCESS_TOKEN: ${{ secrets.ZERODHA_ACCESS_TOKEN }}
        run: pnpm exec serverless deploy --stage prod --verbose

  # ──────────────────────────────────────────────
  # 3. Deploy signals-service — only when its
  #    files (or shared packages) changed.
  # ──────────────────────────────────────────────
  deploy-signals-service:
    name: Deploy signals-service (AWS)
    needs: [changes, build]
    if: >
      always() &&
      needs.build.result == 'success' &&
      (inputs.force_deploy == true || needs.changes.outputs.signals-service == 'true')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            apps/*/node_modules
          key: build-${{ github.sha }}

      - name: Install dependencies (if cache miss)
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy signals-service
        working-directory: apps/signals-service
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: pnpm exec serverless deploy --stage prod --verbose

  # ──────────────────────────────────────────────
  # 4. Deploy signal-engine (Docker/ECR) — only when
  #    its files changed. Runs after the Node Lambda
  #    jobs finish (or are skipped) because Docker
  #    builds are long and should not block them.
  # ──────────────────────────────────────────────
  deploy-signal-engine:
    name: Deploy signal-engine (AWS ECR + Lambda)
    needs: [changes, build, deploy-portfolio-service, deploy-signals-service]
    if: >
      always() &&
      needs.build.result == 'success' &&
      (inputs.force_deploy == true || needs.changes.outputs.signal-engine == 'true') &&
      (needs.deploy-portfolio-service.result == 'success' || needs.deploy-portfolio-service.result == 'skipped') &&
      (needs.deploy-signals-service.result == 'success' || needs.deploy-signals-service.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/arm64

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy signal-engine
        working-directory: apps/signal-engine
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRADING_MODE: ${{ vars.TRADING_MODE }}
        run: pnpm exec serverless deploy --stage prod --verbose

  # ──────────────────────────────────────────────
  # 5. Deploy web (Next.js) to Vercel — only when
  #    its files (or shared packages) changed.
  # ──────────────────────────────────────────────
  deploy-web:
    name: Deploy web (Vercel)
    needs: [changes, build]
    if: >
      always() &&
      needs.build.result == 'success' &&
      (inputs.force_deploy == true || needs.changes.outputs.web == 'true')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            apps/*/node_modules
          key: build-${{ github.sha }}

      - name: Install dependencies (if cache miss)
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
