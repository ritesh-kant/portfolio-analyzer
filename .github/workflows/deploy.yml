name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy all services, ignoring change detection'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  NODE_VERSION: '20'
  PNPM_VERSION: '9.12.3'

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      portfolio-service: ${{ steps.filter.outputs.portfolio-service }}
      analytics-service: ${{ steps.filter.outputs.analytics-service }}
      signal-engine: ${{ steps.filter.outputs.signal-engine }}
      momentum-scanner: ${{ steps.filter.outputs.momentum-scanner }}
      web: ${{ steps.filter.outputs.web }}
      any-backend: ${{ steps.filter.outputs.any-backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infrastructure/serverless.yml'
            portfolio-service:
              - 'apps/portfolio-service/**'
              - 'packages/**'
            analytics-service:
              - 'apps/analytics-service/**'
              - 'packages/**'
            signal-engine:
              - 'apps/signal-engine/**'
              - 'infrastructure/serverless.yml'
              - 'packages/**'
            momentum-scanner:
              - '.github/workflows/deploy.yml'
              - 'apps/signal-engine/Dockerfile.scanner'
              - 'apps/signal-engine/src/momentum_trader/**'
              - 'apps/signal-engine/src/config.py'
              - 'apps/signal-engine/pyproject.toml'
              - 'apps/signal-engine/uv.lock'
              - 'infrastructure/ecs-scanner.yml'
            web:
              - 'apps/web/**'
              - 'packages/**'
            any-backend:
              - 'apps/portfolio-service/**'
              - 'apps/analytics-service/**'
              - 'apps/signal-engine/**'
              - 'packages/**'

  build:
    name: Build monorepo
    needs: changes
    if: >
      inputs.force_deploy == true ||
      needs.changes.outputs.any-backend == 'true' ||
      needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          working-directory: apps/signal-engine
          enable-cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        run: pnpm typecheck

      - name: Build packages
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        run: pnpm build --filter='./packages/*'

      - name: Cache build output
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            apps/*/node_modules
          key: build-${{ github.sha }}

  deploy-infra:
    name: Deploy shared infrastructure (AWS)
    needs: [changes]
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy infrastructure
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
        run: pnpm exec serverless deploy --stage prod --verbose --config infrastructure/serverless.yml

  deploy-portfolio-service:
    name: Deploy portfolio-service (AWS)
    needs: [changes, build]
    if: >
      always() &&
      needs.build.result == 'success' &&
      (inputs.force_deploy == true || needs.changes.outputs.portfolio-service == 'true')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore build cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            apps/*/node_modules
          key: build-${{ github.sha }}

      - name: Install dependencies (if cache miss)
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy portfolio-service
        working-directory: apps/portfolio-service
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
          ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN }}
        run: pnpm exec serverless deploy --stage prod --verbose

  deploy-signal-engine:
    name: Deploy signal-engine Lambda (paused)
    needs: [changes, build, deploy-infra, deploy-portfolio-service]
    # The Lambda is not currently in service. Keep its deployment definition
    # available, but do not deploy it until this flag is deliberately restored.
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore build cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            apps/*/node_modules
          key: build-${{ github.sha }}

      - name: Install root dependencies (if cache miss)
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ECR repo URI
        id: ecr
        run: |
          URI=$(aws cloudformation list-exports \
            --no-paginate \
            --query "Exports[?Name=='prod-signal-engine-ecr-url'].Value" \
            --output text)
          URI="${URI//[$'\t\r\n ']}"
          if [[ -z "$URI" || "$URI" == "None" ]]; then
            echo "ERROR: CloudFormation export 'prod-signal-engine-ecr-url' not found. Run deploy-infra first."
            exit 1
          fi
          echo "uri=$URI" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: apps/signal-engine
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.uri }}:${{ github.sha }}
          cache-from: type=gha,scope=signal-engine
          cache-to: type=gha,mode=max,scope=signal-engine
          provenance: false

      - name: Deploy signal-engine
        working-directory: apps/signal-engine
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
          SIGNAL_ENGINE_IMAGE_URI: ${{ steps.ecr.outputs.uri }}:${{ github.sha }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          TRADING_MODE: ${{ vars.TRADING_MODE }}
        run: pnpm exec serverless deploy --stage prod --verbose

  deploy-momentum-scanner:
    name: Deploy momentum paper scanner (ECS)
    needs: [changes, build]
    if: >
      always() &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (inputs.force_deploy == true || needs.changes.outputs.momentum-scanner == 'true')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve scanner ECR repository
        id: ecr
        run: |
          URI=$(aws ecr describe-repositories \
            --repository-names portfolio-analyzer-mt-scanner \
            --query 'repositories[0].repositoryUri' --output text)
          echo "uri=$URI" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push scanner image
        uses: docker/build-push-action@v6
        with:
          context: apps/signal-engine
          file: apps/signal-engine/Dockerfile.scanner
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.uri }}:${{ github.sha }}
          cache-from: type=gha,scope=momentum-scanner
          cache-to: type=gha,mode=max,scope=momentum-scanner
          provenance: false

      - name: Resolve existing scanner network settings
        id: stack
        run: |
          PARAMETERS=$(aws cloudformation describe-stacks --stack-name mt-scanner-prod \
            --query 'Stacks[0].Parameters' --output json)
          value() { jq -r --arg key "$1" '.[] | select(.ParameterKey == $key) | .ParameterValue' <<<"$PARAMETERS"; }
          for KEY in SubnetIds SecurityGroupId Cpu Memory; do
            VALUE=$(value "$KEY")
            if [[ -z "$VALUE" || "$VALUE" == "null" ]]; then
              echo "Missing existing mt-scanner-prod parameter: $KEY" >&2
              exit 1
            fi
            echo "${KEY,,}=$VALUE" >> "$GITHUB_OUTPUT"
          done

      - name: Deploy scanner task definition and schedule
        run: |
          aws cloudformation deploy \
            --stack-name mt-scanner-prod \
            --template-file infrastructure/ecs-scanner.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              Stage=prod \
              ImageUri=${{ steps.ecr.outputs.uri }}:${{ github.sha }} \
              SubnetIds=${{ steps.stack.outputs.subnetids }} \
              SecurityGroupId=${{ steps.stack.outputs.securitygroupid }} \
              Cpu=${{ steps.stack.outputs.cpu }} \
              Memory=${{ steps.stack.outputs.memory }} \
            --region ${{ env.AWS_REGION }} \
            --no-fail-on-empty-changeset

  deploy-analytics-service:
    name: Deploy analytics-service (AWS)
    needs: [changes, build]
    if: >
      always() &&
      needs.changes.outputs.analytics-service == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore build cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
            apps/*/node_modules
          key: build-${{ github.sha }}

      - name: Install dependencies (if cache miss)
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy analytics-service
        working-directory: apps/analytics-service
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
          ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN }}
        run: pnpm exec serverless deploy --stage prod --verbose

  # web (Next.js) is deployed via the Vercel dashboard Git integration.
  # No CI job needed — Vercel detects pushes to main automatically.
